env:
  # The app reads all application credentials from BECOME_RUNTIME_CONFIG in
  # @redbtn/redsecrets. These two values are the only secret-store bootstrap
  # inputs and never contain application credentials.
  - variable: REDSECRETS_MONGODB_URI
    secret: REDSECRETS_MONGODB_URI
  - variable: SECRETS_ENCRYPTION_KEY
    secret: SECRETS_ENCRYPTION_KEY
