# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef

env:
  # Runtime credentials are resolved from @redbtn/redsecrets. Only the
  # encrypted store's connection and key are available as process bootstrap.
  - variable: REDSECRETS_MONGODB_URI
    secret: REDSECRETS_MONGODB_URI
  - variable: SECRETS_ENCRYPTION_KEY
    secret: SECRETS_ENCRYPTION_KEY
